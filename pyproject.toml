[project]
name = "mario-ai"
version = "0.1.0"
description = "A reinforcement-learning agent that plays Super Mario World"
authors = [
    { name = "Adam Manning", email = "manning.adam@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "imageio[ffmpeg]>=2.38.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "stable-baselines3>=2.9.2",
    "stable-retro>=1.0.1",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
stable-retro = { git = "https://github.com/Farama-Foundation/stable-retro", rev = "089f3fd1aa99c0704fa2b135cfdf824180c3c715" }
